[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtrap"
version = "0.1.0"
description = "Per-chunk signed provenance with O(1) traceback and source revocation for RAG ingestion pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "provenance", "ed25519", "supply-chain", "poisoning", "traceback"]
authors = [{ name = "RAGtrap authors" }]

# Pinned, bounded dependency ranges. The runnable core (signing, datastore,
# traceback, revocation) depends only on `cryptography`. Dataset fetching uses
# `datasets`/`huggingface-hub`; these are optional extras so the core runs offline.
dependencies = [
    "cryptography>=42.0,<46.0",
]

[project.optional-dependencies]
data = [
    "datasets>=2.18,<4.0",
    "huggingface-hub>=0.23,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
ragtrap = "ragtrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
