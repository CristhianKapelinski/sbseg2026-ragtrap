[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtrap"
version = "0.1.0"
description = "Per-chunk signed provenance with O(1) traceback and source revocation for RAG ingestion pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "provenance", "ed25519", "supply-chain", "poisoning", "traceback"]
authors = [{ name = "RAGtrap authors" }]

# Pinned, bounded dependency ranges. The runnable core (signing, datastore,
# traceback, revocation, the constant-time experiments) depends only on
# `cryptography`. The `data` extra fetches the BEIR corpus and third-party
# attack files; the `eval` extra adds the dense retriever and the local LLM that
# serves the RAGForensics judge baseline and the attack-success measurement.
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
data = [
    "datasets>=2.18",
    "huggingface-hub>=0.23",
    "pyarrow>=15.0",
]
eval = [
    "datasets>=2.18",
    "huggingface-hub>=0.23",
    "pyarrow>=15.0",
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "scipy>=1.11",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ragtrap = "ragtrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
